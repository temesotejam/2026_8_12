name: CoreS3 simulation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build host simulator and tests
        run: cmake --build build --parallel
      - name: Run logic tests
        run: ctest --test-dir build --output-on-failure
      - name: Run demonstration scenario
        run: ./build/cores3_sim scenarios/demo.csv artifacts
      - name: Upload simulated CoreS3 screen frames
        uses: actions/upload-artifact@v4
        with:
          name: cores3-sim-frames
          path: artifacts/
          if-no-files-found: error

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build M5Stack CoreS3 firmware
        run: pio run -e m5stack-cores3

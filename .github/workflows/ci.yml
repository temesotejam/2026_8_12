name: CoreS3 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build CoreS3 firmware
        run: pio run

  wokwi-smoke:
    name: Wokwi behavior smoke test
    needs: build
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Build CoreS3 firmware
        run: pio run

      - name: Run firmware in Wokwi
        id: wokwi
        if: ${{ env.WOKWI_CLI_TOKEN != '' }}
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ env.WOKWI_CLI_TOKEN }}
          path: /
          timeout: 10000
          expect_text: 'SIM_CHECK:PASS'
          fail_text: 'SIM_CHECK:FAIL'
          serial_log_file: 'wokwi-serial.log'

      - name: Explain missing Wokwi token
        if: ${{ env.WOKWI_CLI_TOKEN == '' }}
        run: echo "::notice::Wokwi simulation skipped. Add repository secret WOKWI_CLI_TOKEN to enable the behavior test."

      - name: Upload Wokwi serial log
        if: ${{ always() && env.WOKWI_CLI_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wokwi-serial-log
          path: wokwi-serial.log
          if-no-files-found: ignore

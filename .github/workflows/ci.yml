name: CoreS3 simulation CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build host simulator and tests
        run: cmake --build build --parallel
      - name: Run logic and virtual hardware tests
        run: ctest --test-dir build --output-on-failure
      - name: Run normal demonstration scenario
        run: ./build/cores3_sim scenarios/demo.csv artifacts/demo
      - name: Run I2C and UART fault-injection scenario
        run: ./build/cores3_sim scenarios/bus_faults.csv artifacts/bus_faults
      - name: Run transport timing and SD fault scenario
        run: ./build/cores3_sim scenarios/transport_faults.csv artifacts/transport_faults
      - name: Run BNO08X reset and report-stall scenario
        run: ./build/cores3_sim scenarios/bno08x_faults.csv artifacts/bno08x_faults
      - name: Run INA226 conversion and recovery scenario
        run: ./build/cores3_sim scenarios/ina226_faults.csv artifacts/ina226_faults
      - name: Run VL53L5CX multizone and recovery scenario
        run: ./build/cores3_sim scenarios/vl53l5cx_faults.csv artifacts/vl53l5cx_faults
      - name: Run dual-controller UART fault scenario
        run: ./build/dual_controller_sim scenarios/dual_uart_faults.csv artifacts/dual_uart_faults
      - name: Run healthy-link STOP propagation scenario
        run: ./build/dual_controller_sim scenarios/dual_uart_stop.csv artifacts/dual_uart_stop
      - name: Run production boat_protocol fault scenario
        run: ./build/production_protocol_sim scenarios/production_protocol_faults.csv artifacts/production_protocol_faults
      - name: Run production safety command scenario
        run: ./build/production_protocol_sim scenarios/production_protocol_safety.csv artifacts/production_protocol_safety
      - name: Run production command retry and telemetry scenario
        run: ./build/production_command_telemetry_sim scenarios/production_command_retry.csv artifacts/production_command_retry
      - name: Run production malformed command timeout scenario
        run: ./build/production_command_telemetry_sim scenarios/production_command_timeout.csv artifacts/production_command_timeout
      - name: Run full production telemetry failsafe scenario
        run: ./build/production_command_telemetry_sim scenarios/production_telemetry_failsafe.csv artifacts/production_telemetry_failsafe
      - name: Upload simulated CoreS3 screen frames and traces
        uses: actions/upload-artifact@v4
        with:
          name: cores3-sim-artifacts
          path: artifacts/
          if-no-files-found: error

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build M5Stack CoreS3 firmware
        run: pio run -e m5stack-cores3
